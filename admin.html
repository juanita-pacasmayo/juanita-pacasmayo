<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administración | Juanita Pacasmayo</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Montserrat:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS PRINCIPAL -->
  <link rel="stylesheet" href="styles.css">

</head>


<body>


  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="site-header">

    <a href="index.html" class="brand">

      <!-- Si tu logo tiene otro nombre, cambia esta ruta -->
      <img
        src="logo.png"
        alt="Juanita Pacasmayo"
      >

    </a>


    <nav class="main-nav">

      <a href="index.html">
        Inicio
      </a>

      <a href="index.html#productos">
        Productos
      </a>

      <a href="index.html#servicios">
        Servicios
      </a>

      <a href="index.html#contacto">
        Contacto
      </a>

    </nav>


    <a
      href="index.html"
      class="contact-button"
    >
      Volver a la página
    </a>

  </header>



  <!-- =====================================================
       ADMINISTRACIÓN
       ===================================================== -->

  <main>

    <section class="admin-section">

      <div class="admin-container">


        <!-- ENCABEZADO -->

        <p class="section-kicker">
          ADMINISTRACIÓN
        </p>


        <h2>
          Registrar compra o servicio
        </h2>


        <p class="section-lead">

          Registra una compra o servicio y el sistema
          calculará automáticamente los puntos del cliente.

        </p>



        <!-- =================================================
             FORMULARIO
             ================================================= -->

        <div class="admin-form">


          <!-- =================================================
               CÓDIGO DEL CLIENTE
               ================================================= -->

          <div class="form-group">

            <label for="codigoRegistro">
              Código del cliente
            </label>


            <div class="campo-con-boton">

              <input
                type="text"
                id="codigoRegistro"
                placeholder="Ejemplo: JP0001"
                autocomplete="off"
              >


              <button
                type="button"
                id="btnBuscarCliente"
                class="button secondary"
              >
                🔎 Buscar
              </button>

            </div>

          </div>



          <!-- =================================================
               INFORMACIÓN DEL CLIENTE
               ================================================= -->

          <div
            id="clienteRegistro"
            class="cliente-registro"
            style="display: none;"
          >

            <div class="cliente-icono">
              👤
            </div>


            <div>

              <span>
                Cliente encontrado
              </span>


              <strong id="nombreRegistro">
                -
              </strong>


              <small id="puntosRegistro">
                ⭐ 0 puntos
              </small>

            </div>

          </div>



          <!-- =================================================
               TIPO
               ================================================= -->

          <div class="form-group">

            <label for="tipoRegistro">
              Tipo de movimiento
            </label>


            <select id="tipoRegistro">

              <option value="Servicio">
                Servicio
              </option>

              <option value="Compra">
                Compra
              </option>

            </select>

          </div>



          <!-- =================================================
               CONCEPTO
               ================================================= -->

          <div class="form-group">

            <label for="conceptoRegistro">
              Servicio o concepto
            </label>


            <select id="conceptoRegistro">

              <option value="Laceado">
                💇 Laceado
              </option>

              <option value="Uñas">
                💅 Uñas
              </option>

              <option value="Pestañas">
                👁️ Pestañas
              </option>

              <option value="Producto">
                🛍️ Producto
              </option>

              <option value="Otro">
                📌 Otro
              </option>

            </select>

          </div>



          <!-- =================================================
               MONTO
               ================================================= -->

          <div class="form-group">

            <label for="montoRegistro">
              Monto de la compra o servicio
            </label>


            <div class="monto-input">

              <span>
                S/
              </span>


              <input
                type="number"
                id="montoRegistro"
                placeholder="0.00"
                min="0"
                step="0.01"
              >

            </div>

          </div>



          <!-- =================================================
               OBSERVACIÓN
               ================================================= -->

          <div class="form-group">

            <label for="observacionRegistro">
              Observación
              <span class="opcional">
                (opcional)
              </span>
            </label>


            <textarea
              id="observacionRegistro"
              rows="3"
              placeholder="Ejemplo: Servicio realizado correctamente"
            ></textarea>

          </div>



          <!-- =================================================
               BOTÓN REGISTRAR
               ================================================= -->

          <button
            type="button"
            id="btnRegistrarMovimiento"
            class="button primary"
          >

            🧾 Registrar compra / servicio

          </button>



          <!-- =================================================
               MENSAJE
               ================================================= -->

          <div
            id="mensajeRegistro"
            class="mensaje-registro"
          ></div>



          <!-- =================================================
               RESULTADO
               ================================================= -->

          <div
            id="resultadoRegistro"
            class="resultado-registro"
            style="display: none;"
          >

            <div class="resultado-icono">
              🎉
            </div>


            <h3>
              Movimiento registrado
            </h3>


            <p id="detalleRegistro">
              -
            </p>

          </div>


        </div>

      </div>

    </section>

  </main>



  <!-- =====================================================
       PIE DE PÁGINA
       ===================================================== -->

  <footer>

    <p>
      © Juanita Pacasmayo | Administración
    </p>

  </footer>



  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <!-- IMPORTANTE:
       Todavía no conectamos Apps Script.
       Lo haremos en el siguiente paso.
  -->

</body>

</html>
