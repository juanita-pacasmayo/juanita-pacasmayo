<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administración | Juanita Pacasmayo</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <section class="admin-section">

    <div class="admin-container">

      <p class="section-kicker">
        ADMINISTRACIÓN
      </p>

      <h2>
        Registrar compra o servicio
      </h2>

      <p class="section-lead">
        Área exclusiva para administración.
      </p>

      <div class="admin-form">

        <div class="form-group">

          <label for="codigoRegistro">
            Código del cliente
          </label>

          <input
            type="text"
            id="codigoRegistro"
            placeholder="Ejemplo: JP0001"
          >

        </div>

        <div class="form-group">

          <label for="montoRegistro">
            Monto
          </label>

          <input
            type="number"
            id="montoRegistro"
            placeholder="0.00"
            min="0"
            step="0.01"
          >

        </div>

        <button
          type="button"
          class="button primary"
          id="btnRegistrarMovimiento"
        >
          🧾 Registrar
        </button>

      </div>

    </div>

  </section>

</body>

</html>
