<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Acceso administrativo de Juanita Pacasmayo"
  >

  <title>Acceso administrativo | Juanita Pacasmayo</title>


  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Great+Vibes&display=swap"
    rel="stylesheet"
  >


  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >


  <!-- CSS EXCLUSIVO DEL LOGIN -->

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>


<body class="login-page">


  <!-- =====================================================
       FONDO
  ===================================================== -->

  <main class="login-container">


    <!-- ===================================================
         TARJETA LOGIN
    =================================================== -->

    <section class="login-card">


      <!-- LOGO -->

      <div class="login-logo-container">

        <img
          src="images/Logo.png"
          alt="Juanita Pacasmayo"
          class="login-logo"
        >

      </div>


      <!-- DECORACIÓN -->

      <div class="login-decoration">

        <span></span>

        <i class="fa-solid fa-crown"></i>

        <span></span>

      </div>


      <!-- TÍTULO -->

      <p class="section-kicker">
        ADMINISTRACIÓN
      </p>


      <h1>
        Acceso administrativo
      </h1>


      <p class="login-description">
        Ingresa tus datos para acceder al panel
        de administración.
      </p>


      <!-- =================================================
           FORMULARIO
      ================================================= -->

      <form id="loginForm">


        <!-- USUARIO -->

        <div class="login-field">


          <label for="usuario">
            Usuario
          </label>


          <div class="input-wrapper">

            <i class="fa-solid fa-user"></i>


            <input
              type="text"
              id="usuario"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
              required
            >

          </div>


        </div>


        <!-- CONTRASEÑA -->

        <div class="login-field">


          <label for="contrasena">
            Contraseña
          </label>


          <div class="input-wrapper">

            <i class="fa-solid fa-lock"></i>


            <input
              type="password"
              id="contrasena"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            >


            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Mostrar contraseña"
            >

              <i class="fa-solid fa-eye"></i>

            </button>

          </div>


        </div>


        <!-- BOTÓN INGRESAR -->

        <button
          type="submit"
          class="login-button"
        >

          <i class="fa-solid fa-right-to-bracket"></i>

          <span>
            Ingresar
          </span>

        </button>


        <!-- MENSAJE DEL LOGIN -->

        <div
          id="mensajeLogin"
          class="mensaje-registro"
        ></div>


      </form>


      <!-- DIVISOR -->

      <div class="login-divider">

        <span></span>

        <i class="fa-solid fa-heart"></i>

        <span></span>

      </div>


      <!-- VOLVER -->

      <a
        href="index.html"
        class="volver-inicio"
      >

        <i class="fa-solid fa-arrow-left"></i>

        Volver a la página principal

      </a>


      <!-- PIE DE TARJETA -->

      <div class="login-footer">

        <span>
          Juanita Pacasmayo
        </span>

        <small>
          Belleza que inspira
        </small>

      </div>


    </section>


  </main>


  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script src="login.js"></script>


  <!-- MOSTRAR / OCULTAR CONTRASEÑA -->

  <script>

    const togglePassword =
      document.getElementById("togglePassword");

    const contrasena =
      document.getElementById("contrasena");


    if (
      togglePassword &&
      contrasena
    ) {

      togglePassword.addEventListener(
        "click",
        function () {

          const tipo =
            contrasena.getAttribute("type") === "password"
              ? "text"
              : "password";


          contrasena.setAttribute(
            "type",
            tipo
          );


          const icono =
            this.querySelector("i");


          if (tipo === "text") {

            icono.classList.remove(
              "fa-eye"
            );

            icono.classList.add(
              "fa-eye-slash"
            );

            this.setAttribute(
              "aria-label",
              "Ocultar contraseña"
            );

          } else {

            icono.classList.remove(
              "fa-eye-slash"
            );

            icono.classList.add(
              "fa-eye"
            );

            this.setAttribute(
              "aria-label",
              "Mostrar contraseña"
            );

          }

        }
      );

    }

  </script>


</body>

</html>
