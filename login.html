<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Acceso administrativo - Juanita Pacasmayo"
  >

  <title>Acceso administrativo | Juanita Pacasmayo</title>


  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&display=swap"
    rel="stylesheet"
  >


  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >


  <!-- CSS EXCLUSIVO DEL LOGIN -->

  <link
    rel="stylesheet"
    href="login.css"
  >

</head>


<body class="login-page">


  <!-- =====================================================
       CABECERA
  ===================================================== -->

  <header class="login-header">

    <a
      href="index.html"
      class="login-header-logo"
    >

      <img
        src="images/Logo.png"
        alt="Juanita Pacasmayo"
      >

    </a>


    <a
      href="index.html"
      class="login-header-back"
    >

      <i class="fas fa-arrow-left"></i>

      <span>
        Volver
      </span>

    </a>

  </header>



  <!-- =====================================================
       CONTENIDO
  ===================================================== -->

  <main class="login-container">


    <section class="login-card">


      <!-- =================================================
           ICONO
      ================================================= -->

      <div class="login-icon">

        <i class="fas fa-lock"></i>

      </div>



      <!-- =================================================
           TÍTULO
      ================================================= -->

      <p class="section-kicker">

        ADMINISTRACIÓN

      </p>


      <h1>

        Acceso administrativo

      </h1>


      <p class="login-description">

        Ingresa tus datos para acceder al panel
        de administración.

      </p>



      <!-- =================================================
           FORMULARIO
      ================================================= -->

      <form id="loginForm">


        <!-- USUARIO -->

        <div class="login-field">

          <label for="usuario">

            Usuario

          </label>


          <div class="input-wrapper">

            <i class="fas fa-user"></i>


            <input
              type="text"
              id="usuario"
              placeholder="Ingresa tu usuario"
              autocomplete="username"
              required
            >

          </div>

        </div>



        <!-- CONTRASEÑA -->

        <div class="login-field">

          <label for="contrasena">

            Contraseña

          </label>


          <div class="input-wrapper">

            <i class="fas fa-lock"></i>


            <input
              type="password"
              id="contrasena"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            >


            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Mostrar contraseña"
            >

              <i class="fas fa-eye"></i>

            </button>

          </div>

        </div>



        <!-- BOTÓN -->

        <button
          type="submit"
          class="login-button"
        >

          <i class="fas fa-right-to-bracket"></i>

          <span>
            Ingresar
          </span>

        </button>



        <!-- MENSAJE -->

        <div
          id="mensajeLogin"
          class="mensaje-registro"
        ></div>


      </form>



      <!-- =================================================
           TEXTO INFORMATIVO
      ================================================= -->

      <div class="login-security">

        🔒 Tu información se utiliza únicamente
        para verificar tu acceso.

        <br>

        Nunca se mostrará a otros usuarios.

      </div>



      <!-- =================================================
           VOLVER
      ================================================= -->

      <a
        href="index.html"
        class="volver-inicio"
      >

        <i class="fas fa-house"></i>

        Volver a Juanita Pacasmayo

      </a>


    </section>

  </main>



  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script src="login.js"></script>


  <!-- MOSTRAR / OCULTAR CONTRASEÑA -->

  <script>

    const togglePassword =
      document.getElementById("togglePassword");

    const contrasena =
      document.getElementById("contrasena");


    if (
      togglePassword &&
      contrasena
    ) {

      togglePassword.addEventListener(
        "click",
        function () {

          const mostrar =
            contrasena.type === "password";

          contrasena.type =
            mostrar
              ? "text"
              : "password";


          this.innerHTML =
            mostrar
              ? '<i class="fas fa-eye-slash"></i>'
              : '<i class="fas fa-eye"></i>';

        }
      );

    }

  </script>


</body>

</html>
