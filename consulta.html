<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Consultar mis puntos | Juanita Pacasmayo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Great+Vibes&family=Montserrat:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff4f7,
          #ffffff
        );

      color: #30262b;
    }


    .topbar {

      height: 82px;

      background: rgba(255,255,255,.96);

      border-bottom:
        1px solid #f1dce4;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 5%;

      box-shadow:
        0 5px 20px rgba(120,40,70,.06);

    }


    .topbar img {

      width: 155px;

      height: auto;

      display: block;

    }


    .back {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      text-decoration: none;

      color: #c83d68;

      font-weight: 700;

    }


    .page {

      width: min(500px, 92%);

      margin:
        55px auto 80px;

    }


    .card {

      background: #fff;

      border-radius: 30px;

      padding: 42px 35px;

      border:
        1px solid #f0dce4;

      box-shadow:
        0 20px 55px rgba(120,40,70,.12);

    }


    .icon {

      width: 75px;

      height: 75px;

      margin: 0 auto 22px;

      border-radius: 50%;

      background: #fff0f4;

      color: #c83d68;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 31px;

    }


    .eyebrow {

      text-align: center;

      color: #c9953d;

      text-transform: uppercase;

      letter-spacing: 3px;

      font-size: 12px;

      font-weight: 800;

      margin-bottom: 10px;

    }


    h1 {

      margin: 0;

      text-align: center;

      color: #c83d68;

      font-family: "Montserrat", Arial, sans-serif;

      font-size: 32px;

    }


    .subtitle {

      text-align: center;

      color: #75666d;

      line-height: 1.6;

      margin:
        12px auto 30px;

    }


    .field {

      margin-bottom: 20px;

    }


    .field label {

      display: block;

      margin-bottom: 8px;

      color: #34272d;

      font-weight: 700;

    }


    .input-wrap {

      position: relative;

    }


    .input-wrap i {

      position: absolute;

      left: 17px;

      top: 50%;

      transform: translateY(-50%);

      color: #c83d68;

    }


    input {

      width: 100%;

      height: 55px;

      border:
        1px solid #e8ccd7;

      border-radius: 15px;

      padding:
        0 17px 0 48px;

      font-family: inherit;

      font-size: 16px;

      outline: none;

      transition:
        border .2s ease,
        box-shadow .2s ease;

    }


    input:focus {

      border-color: #c83d68;

      box-shadow:
        0 0 0 4px rgba(200,61,104,.10);

    }


    .pin-toggle {

      position: absolute;

      right: 15px;

      top: 50%;

      transform: translateY(-50%);

      border: 0;

      background: transparent;

      color: #8b6977;

      cursor: pointer;

      font-size: 17px;

    }


    .btn {

      width: 100%;

      height: 56px;

      border: 0;

      border-radius: 999px;

      background: #c83d68;

      color: #fff;

      font-family: "Montserrat", Arial, sans-serif;

      font-weight: 700;

      font-size: 16px;

      cursor: pointer;

      box-shadow:
        0 12px 25px rgba(200,61,104,.20);

      transition:
        transform .2s ease,
        opacity .2s ease;

    }


    .btn:hover {

      transform: translateY(-2px);

    }


    .btn:disabled {

      opacity: .65;

      cursor: wait;

    }


    .message {

      display: none;

      margin-top: 20px;

      padding: 14px 16px;

      border-radius: 14px;

      font-size: 14px;

      line-height: 1.5;

      text-align: center;

    }


    .message.error {

      display: block;

      background: #fff0f2;

      color: #a5274e;

      border: 1px solid #f4ccd8;

    }


    .message.success {

      display: block;

      background: #effaf3;

      color: #28733e;

      border: 1px solid #ccebd6;

    }


    .help {

      text-align: center;

      margin-top: 25px;

      color: #85737b;

      font-size: 13px;

      line-height: 1.6;

    }


    .home {

      display: block;

      text-align: center;

      margin-top: 22px;

      color: #c83d68;

      text-decoration: none;

      font-weight: 700;

    }


    @media(max-width:600px) {

      .topbar {

        height: 72px;

      }

      .topbar img {

        width: 130px;

      }

      .page {

        margin-top: 30px;

      }

      .card {

        padding: 32px 22px;

        border-radius: 25px;

      }

      h1 {

        font-size: 27px;

      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <a href="index.html">

    <img
      src="images/Logo.png"
      alt="Juanita Pacasmayo"
    >

  </a>


  <a
    href="index.html"
    class="back"
  >

    <i class="fas fa-arrow-left"></i>

    Volver

  </a>

</header>


<main class="page">

  <section class="card">


    <div class="icon">

      <i class="fas fa-lock"></i>

    </div>


    <div class="eyebrow">
      Programa de beneficios
    </div>


    <h1>
      Consulta tus puntos
    </h1>


    <p class="subtitle">

      Ingresa tu código de cliente y tu PIN
      para consultar tus puntos e historial.

    </p>


    <form id="consultaForm">


      <div class="field">

        <label for="codigo">
          Código de cliente
        </label>

        <div class="input-wrap">

          <i class="fas fa-user"></i>

          <input
            type="text"
            id="codigo"
            name="codigo"
            placeholder="Ejemplo: JP001"
            autocomplete="username"
            required
          >

        </div>

      </div>


      <div class="field">

        <label for="pin">
          PIN
        </label>

        <div class="input-wrap">

          <i class="fas fa-key"></i>

          <input
            type="password"
            id="pin"
            name="pin"
            placeholder="Ingresa tu PIN"
            inputmode="numeric"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="pin-toggle"
            id="togglePin"
            aria-label="Mostrar PIN"
          >

            <i class="fas fa-eye"></i>

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="btn"
        id="btnConsultar"
      >

        <i class="fas fa-search"></i>

        &nbsp; Consultar mis puntos

      </button>


    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="help">

      🔐 Tu PIN se utiliza únicamente para
      verificar tu acceso.

      <br>

      Nunca se mostrará en tu cuenta.

    </div>


    <a
      href="index.html"
      class="home"
    >

      <i class="fas fa-home"></i>

      Volver a Juanita Pacasmayo

    </a>


  </section>

</main>


<script>


  /*
  ==========================================================
  URL DE TU GOOGLE APPS SCRIPT
  ==========================================================

  REEMPLAZA SOLAMENTE ESTA URL POR LA URL REAL
  DE TU WEB APP.

  Ejemplo:

  https://script.google.com/macros/s/XXXXXXXXXXXX/exec
  */

  const URL_WEB_APP =
    "https://script.google.com/macros/s/AKfycbxZW06LP3ctRtIZXBBlo3paILCjcBjQVDMCuOLmNnqU4BuZpbMz3b8jh82V8ZNki1U/exec";


  const form =
    document.getElementById(
      "consultaForm"
    );


  const codigoInput =
    document.getElementById(
      "codigo"
    );


  const pinInput =
    document.getElementById(
      "pin"
    );


  const btnConsultar =
    document.getElementById(
      "btnConsultar"
    );


  const message =
    document.getElementById(
      "message"
    );


  const togglePin =
    document.getElementById(
      "togglePin"
    );


  /*
  ==========================================================
  MOSTRAR / OCULTAR PIN
  ==========================================================
  */

  togglePin.addEventListener(
    "click",
    function() {

      if (
        pinInput.type === "password"
      ) {

        pinInput.type = "text";

        togglePin.innerHTML =
          '<i class="fas fa-eye-slash"></i>';

      } else {

        pinInput.type = "password";

        togglePin.innerHTML =
          '<i class="fas fa-eye"></i>';

      }

    }
  );


  /*
  ==========================================================
  MENSAJE
  ==========================================================
  */

  function mostrarMensaje(
    texto,
    tipo
  ) {

    message.textContent =
      texto;

    message.className =
      "message " + tipo;

  }


  /*
  ==========================================================
  CONSULTAR
  ==========================================================
  */

  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const codigo =
        codigoInput.value
          .trim()
          .toUpperCase();


      const pin =
        pinInput.value
          .trim();


      if (!codigo) {

        mostrarMensaje(
          "Ingresa tu código de cliente.",
          "error"
        );

        codigoInput.focus();

        return;

      }


      if (!pin) {

        mostrarMensaje(
          "Ingresa tu PIN.",
          "error"
        );

        pinInput.focus();

        return;

      }


      if (
        URL_WEB_APP ===
        "URL_DE_TU_WEB_APP"
      ) {

        mostrarMensaje(
          "Falta configurar la URL de Google Apps Script.",
          "error"
        );

        return;

      }


      btnConsultar.disabled =
        true;


      btnConsultar.innerHTML =
        '<i class="fas fa-spinner fa-spin"></i> Verificando...';


      message.className =
        "message";


      try {


        const url =
          URL_WEB_APP +
          "?accion=consultarPuntos" +
          "&codigo=" +
          encodeURIComponent(codigo) +
          "&pin=" +
          encodeURIComponent(pin);


        const response =
          await fetch(url, {
            method: "GET",
            redirect: "follow"
          });


        if (!response.ok) {

          throw new Error(
            "No se pudo conectar con el servidor."
          );

        }


        const resultado =
          await response.json();


        if (
          !resultado.correcto
        ) {

          throw new Error(
            resultado.mensaje ||
            "Código o PIN incorrecto."
          );

        }


        /*
        ======================================================
        GUARDAMOS LOS DATOS TEMPORALMENTE
        ======================================================

        NO GUARDAMOS EL PIN.

        Solo guardamos el resultado autorizado.
        */

        sessionStorage.setItem(
          "clientePuntos",
          JSON.stringify({

            cliente:
              resultado.cliente,

            codigoCliente:
              resultado.codigoCliente,

            puntos:
              resultado.puntos,

            estado:
              resultado.estado,

            historial:
              resultado.historial || []

          })
        );


        mostrarMensaje(
          "Acceso correcto. Cargando tus puntos...",
          "success"
        );


        /*
        ======================================================
        ABRIR PUNTOS.HTML
        ======================================================
        */

        setTimeout(
          function() {

            window.location.href =
              "puntos.html";

          },
          500
        );


      } catch(error) {

        console.error(error);


        mostrarMensaje(
          error.message ||
          "No se pudo realizar la consulta.",
          "error"
        );


        btnConsultar.disabled =
          false;


        btnConsultar.innerHTML =
          '<i class="fas fa-search"></i> &nbsp; Consultar mis puntos';

      }

    }
  );


</script>

</body>
</html>
